[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-rag"
version = "1.0.0"
description = "NEXUS RAG — Neural EXtensible Unified Search. Enterprise-grade RAG pipeline with 17 integrated components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "NEXUS Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Vector DB
    "qdrant-client>=1.9.0",
    # Knowledge Graph
    "neo4j>=5.0.0",
    # Sparse Retrieval
    "rank-bm25>=0.2.2",
    # LLM
    "anthropic>=0.25.0",
    # Embeddings & NLP
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    # API Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Task Queue
    "celery[redis]>=5.3.0",
    # Cache
    "redis>=5.0.0",
    # Database
    "psycopg2-binary>=2.9.9",
    # Streaming
    "kafka-python>=2.0.2",
    # Audio
    "openai-whisper>=20231117",
    # Language Detection
    "langdetect>=1.0.9",
    # NLP Utilities
    "spacy>=3.7.0",
    "numpy>=1.26.0",
    # Data Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Document Parsing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.0",
    # Image Processing
    "Pillow>=10.3.0",
    # Monitoring
    "langsmith>=0.1.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]
clip = [
    "clip-by-openai>=1.1",
]

[project.scripts]
nexus-api = "nexus.api.main:run"
nexus-worker = "nexus.tasks:run_worker"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services",
    "slow: long-running tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
